services:
  backend:
    build:
      context: ./backend
    environment:
      PETAL_COOKIE_SECURE: ${PETAL_COOKIE_SECURE:-false}
      PETAL_SESSION_SECRET: ${PETAL_SESSION_SECRET:?Run scripts/start.ps1 to create a local session key}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      PETAL_API_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
